<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2a2013"/>
      <stop offset="55%" stop-color="#16110a"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="45%" stop-color="#e88a1e"/>
      <stop offset="100%" stop-color="#b3241a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- stone plate -->
  <rect x="2" y="2" width="124" height="124" rx="24" fill="url(#bg)" stroke="#8c6b3d" stroke-width="4"/>

  <!-- looming shadow: horned head + shoulders -->
  <path fill="#080604" d="M64 20
    c-7 0-11 5-14 12-4-6-11-9-16-6 2 7 6 12 11 16
    -9 7-15 18-16 31
    -1 10 3 20 8 28
    l6 25h42l6-25c5-8 9-18 8-28
    -1-13-7-24-16-31 5-4 9-9 11-16
    -5-3-12 0-16 6-3-7-7-12-14-12z"/>

  <!-- menacing glowing eyes, slanted inward -->
  <g filter="url(#glow)">
    <path fill="url(#eye)" d="M44 60l16 5-3 10-15-4z"/>
    <path fill="url(#eye)" d="M84 60l-16 5 3 10 15-4z"/>
  </g>
  <circle cx="52" cy="65" r="2.4" fill="#3a0d08"/>
  <circle cx="76" cy="65" r="2.4" fill="#3a0d08"/>

  <!-- claw slash across the stone -->
  <g fill="#7a1512" opacity="0.9">
    <path d="M30 96c14 6 30 9 46 9s32-3 46-9c-14 9-30 13-46 13s-32-4-46-13z"/>
  </g>
</svg>
